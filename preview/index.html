<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Recorder</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #d5d7dc; font-family: system-ui, sans-serif; color: #1c1c1c; }
    .board { display: flex; gap: 28px; justify-content: center; flex-wrap: wrap; padding: 28px 16px 48px; }
    figure { margin: 0; }
    figcaption { margin-top: 10px; font-size: 13px; letter-spacing: 0.04em; text-transform: uppercase; }
    .phone { width: 390px; height: 780px; background: #e9ebef; border-radius: 28px; overflow: hidden; box-shadow: 0 18px 40px rgba(0,0,0,.16); }
    .setup { padding: 72px 28px 0; text-align: center; }
    .stage { width: 240px; height: 240px; margin: 0 auto; position: relative; }
    .ring { position: absolute; border: 1px solid #c5cad1; border-radius: 50%; }
    .ring.a { inset: 10px; }
    .ring.b { inset: 36px; }
    .btn { position: absolute; inset: 64px; border-radius: 50%; background: #111; }
    h1 { margin: 28px 0 0; font-size: 32px; font-weight: 500; color: #2c2e33; }
    p { margin: 12px 0 0; color: #5c6168; font-size: 15px; line-height: 1.45; }
    .home { padding: 28px 20px; text-align: left; }
    .home h1 { margin: 0; font-weight: 700; color: #1c1c1c; }
    .status { margin-top: 8px; color: #5c6168; font-size: 15px; }
    .row { margin-top: 16px; background: #fff; padding: 16px; font-size: 16px; }
  </style>
</head>
<body>
  <main class="board">
    <figure>
      <div class="phone setup">
        <div class="stage">
          <div class="ring a"></div>
          <div class="ring b"></div>
          <div class="btn"></div>
        </div>
        <h1>Start recording</h1>
        <p>This app records a phone call when the call starts and stops when the call ends. It waits until you allow the microphone, phone, and notification permissions. Android may block call audio on this phone. Recordings stay on the device.</p>
      </div>
      <figcaption>Setup</figcaption>
    </figure>
    <figure>
      <div class="phone home">
        <h1>Recordings</h1>
        <div class="status">Waiting for a call.</div>
        <div class="row">2026-10-28 18:40:02 · Incoming</div>
        <div class="row">2026-10-28 09:12:44 · Outgoing</div>
      </div>
      <figcaption>Shelf</figcaption>
    </figure>
  </main>
</body>
</html>
